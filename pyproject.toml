[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drishti"
version = "0.1.0"
description = "DRISHTI — single-pass drone video to accurate, georeferenced 3D model (offline, ground-only)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "DRISHTI team" }]

# --- Core (light) dependencies: the runnable spine. No GPU, no native geo libs. ---
# Everything here installs from wheels on the target Intel machine and in CI.
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "typer>=0.9",
    "rich>=13.0",
    "numpy>=1.24",
    "psutil>=5.9",
]

[project.optional-dependencies]
# Heavy / environment-specific groups. Installed per environment (local vs cloud T4),
# never required for the core pipeline machinery. See docs/implementation/02-SYSTEM-DESIGN.md.
video   = ["av>=11.0", "opencv-python-headless>=4.9"]
geo     = ["pyproj>=3.6", "rasterio>=1.3", "shapely>=2.0"]        # + GDAL/PDAL via system pkgs
recon   = ["open3d>=0.18", "trimesh>=4.0", "pygltflib>=1.16"]
texture = ["xatlas==0.0.11", "pillow>=10", "trimesh>=4.0", "scipy>=1.11"]
poses   = ["pycolmap>=0.6"]                                        # GLOMAP via system binary
spine   = ["gtsam>=4.2"]
telem   = ["pymavlink>=2.4", "piexif>=1.1"]
depth   = ["torch>=2.2", "openvino>=2024.0", "onnx>=1.15", "transformers>=4.45", "huggingface_hub>=0.24", "timm", "safetensors"]
gaussian = ["torch>=2.2", "gsplat>=1.5"]                            # CUDA-only optional dense backend
export  = ["laspy[lazrs]>=2.5"]                                     # LAS/LAZ validation/export
server  = ["fastapi>=0.110", "uvicorn>=0.29"]
dev     = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.9", "httpx>=0.27"]  # httpx: FastAPI TestClient

[project.scripts]
drishti = "drishti.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Intentional, non-pedantic set: pyflakes/pycodestyle errors, import order,
# modern-syntax upgrades, bugbear, comprehensions, and common simplifications.
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",    # line length is enforced by the formatter, not the linter
    "SIM105",  # contextlib.suppress is not always clearer than try/except/pass
]

[tool.ruff.lint.flake8-bugbear]
# Typer and FastAPI REQUIRE these calls in parameter defaults (dependency
# injection); they are not the B006/B008 mutable-default footgun.
extend-immutable-calls = [
    "typer.Option", "typer.Argument",
    "fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.File", "fastapi.Form",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # tests may adjust sys.path before importing the package

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
